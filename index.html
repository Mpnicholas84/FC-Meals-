Icon definitions confirmed by the airline:
- A cheeseburger / hamburger icon next to a passenger means that passenger HAS a meal preorder. Set preorderIcon true. If the meal name is also visible, put it in "meal".
- A dollar-sign-like symbol ($) next to a passenger means a SPECIAL MEAL request. Set specialIcon true, and put any visible special meal code or name (e.g. VGML, GFML, "Gluten free") in "specialMeal".
